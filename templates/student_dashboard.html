<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Öğrenci Öğrenme Paneli</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #f1f5f9;
            color: #243247;
            font-family: Arial, sans-serif;
        }

        main {
            width: min(760px, 94%);
            margin: 60px auto;
            background: white;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 8px 30px #00000012;
        }

        h1 {
            text-align: center;
            font-size: 32px;
            margin: 0 0 12px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 32px;
        }

        .student-selection {
            margin: 24px 0;
        }

        label {
            display: block;
            font-size: 19px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        select {
            width: 100%;
            padding: 16px;
            font-size: 20px;
            border: 2px solid #cbd5e1;
            border-radius: 12px;
            background: white;
        }

        button {
            width: 100%;
            padding: 17px;
            margin-top: 14px;
            border-radius: 12px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
        }

        .start-button {
            border: none;
            background: #2563eb;
            color: white;
        }

        .end-button {
            border: 2px solid #b91c1c;
            background: white;
            color: #b91c1c;
        }

        button:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        button:focus-visible,
        select:focus-visible {
            outline: 4px solid #93c5fd;
            outline-offset: 3px;
        }

        .welcome {
            text-align: center;
            padding: 24px;
            margin: 24px 0;
            background: #eff6ff;
            border-radius: 16px;
        }

        .welcome h2 {
            font-size: 28px;
        }

        .activities {
            padding: 24px;
            margin-top: 24px;
            border: 1px solid #dbe3ed;
            border-radius: 16px;
        }

        .message {
            min-height: 24px;
            text-align: center;
            margin-top: 20px;
            color: #b91c1c;
        }

        [hidden] {
            display: none !important;
        }

        @media (max-width: 600px) {
            main {
                margin: 20px auto;
                padding: 24px;
            }

            h1 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

<main>

    <h1>Öğrenci Öğrenme Paneli</h1>

    <p class="subtitle">
        Kişiselleştirilmiş Öğrenme
    </p>

    <section id="selectionPanel"
             class="student-selection">

        <label for="studentSelect">
            Öğrenci Seçiniz
        </label>

        <select id="studentSelect" disabled>
            <option value="">
                Öğrenci seçiniz
            </option>
        </select>

    </section>

    <section id="welcomePanel"
             class="welcome" hidden>

        <h2 id="welcomeMessage"></h2>

        <p id="sequenceStatusMessage"></p>

    </section>

    <button id="startButton"
            class="start-button"
            type="button"
            disabled>
        Öğrenmeye Başla
    </button>

    <button id="endButton"
            class="end-button"
            type="button"
            disabled>
        Oturumu Sonlandır
    </button>

    <button id="continueButton"
            class="start-button"
            type="button"
            hidden disabled>
        Sonraki Etkinlik
    </button>

    <button id="recoverButton"
            class="end-button"
            type="button"
            hidden disabled>
        Oturumu Kurtar
    </button>

    <section id="activitiesPanel"
             class="activities" hidden>

        <h2>Etkinliklerim</h2>

        <p>
            <span id="activityStatusMessage"></span>
        </p>

    </section>

    <button id="retryButton"
            class="start-button"
            type="button"
            hidden disabled>
        Tekrar Dene
    </button>

    <p id="message"
       class="message"
       role="status"
       aria-live="polite"></p>

</main>


<script>
    const studentSelect =
        document.getElementById("studentSelect");

    const selectionPanel =
        document.getElementById("selectionPanel");

    const welcomePanel =
        document.getElementById("welcomePanel");

    const welcomeMessage =
        document.getElementById("welcomeMessage");

    const activitiesPanel =
        document.getElementById("activitiesPanel");

    const startButton =
        document.getElementById("startButton");

    const endButton =
        document.getElementById("endButton");

    const continueButton =
        document.getElementById("continueButton");

    const recoverButton =
        document.getElementById("recoverButton");

    const sequenceStatusMessage =
        document.getElementById("sequenceStatusMessage");

    const activityStatusMessage =
        document.getElementById("activityStatusMessage");

    const message =
        document.getElementById("message");

    const retryButton =
        document.getElementById("retryButton");


    let currentStudent = null;

    let currentAssignment = null;

    let currentPerformanceSessionId = null;

    let sequenceStatus = "NO_CONTEXT";

    let busy = false;

    let initialized = false;

    let retryRequired = false;


    async function apiRequest(
        url,
        method = "GET",
        data = null
    ) {

        const options = {
            method: method,
            cache: "no-store"
        };

        if (data !== null) {

            options.headers = {
                "Content-Type": "application/json"
            };

            options.body = JSON.stringify(data);
        }

        const response = await fetch(url, options);

        const result = await response.json();

        if (!response.ok || result.ok === false) {

            throw new Error(
                result.error ||
                "İşlem gerçekleştirilemedi."
            );
        }

        return result;
    }


    function applySequenceResult(result) {

        sequenceStatus = result.sequence_status;

        currentStudent = result.student || null;

        currentAssignment = result.assignment || null;

        currentPerformanceSessionId =
            result.performance_session_id || null;

        if (
            sequenceStatus === "NO_CONTEXT" ||
            sequenceStatus === "NO_ELIGIBLE_ASSIGNMENT"
        ) {

            currentStudent = null;

            currentAssignment = null;
        }
    }


    function updateInterface() {

        const selectable = (
            sequenceStatus === "NO_CONTEXT" ||
            sequenceStatus === "NO_ELIGIBLE_ASSIGNMENT"
        );

        const stale =
            sequenceStatus === "STALE_CONTEXT";

        const canEnd = [
            "ACTIVE",
            "ASSIGNMENT_COMPLETED",
            "BETWEEN_ASSIGNMENTS"
        ].includes(sequenceStatus);

        const canContinue =
            sequenceStatus === "ASSIGNMENT_COMPLETED";

        retryButton.hidden = !retryRequired;

        retryButton.disabled = busy;

        selectionPanel.hidden = !selectable;

        welcomePanel.hidden = !currentStudent;

        activitiesPanel.hidden =
            selectable || stale;

        studentSelect.disabled =
            busy || retryRequired ||
            !selectable || !initialized;

        startButton.hidden = !selectable;

        startButton.disabled =
            busy ||
            retryRequired ||
            !selectable ||
            !initialized ||
            !studentSelect.value;

        endButton.hidden = !canEnd;

        endButton.disabled =
            busy || retryRequired || !canEnd;

        recoverButton.hidden = !stale;

        recoverButton.disabled =
            busy || retryRequired || !stale;

        continueButton.hidden = !canContinue;

        continueButton.disabled =
            busy || retryRequired || !canContinue;

        welcomeMessage.textContent = currentStudent
            ? "Hoş geldin, " + currentStudent.name + "!"
            : "";

        const statusLabels = {

            ACTIVE: "Öğrenme oturumu aktif.",

            ASSIGNMENT_COMPLETED:
                "Etkinlik tamamlandı.",

            BETWEEN_ASSIGNMENTS:
                "Sonraki etkinlik bekleniyor.",

            STALE_CONTEXT:
                "Oturum bilgilerinin kurtarılması gerekiyor."
        };

        sequenceStatusMessage.textContent =
            statusLabels[sequenceStatus] || "";

        activityStatusMessage.textContent =
            sequenceStatus === "ACTIVE"
                ? "Atanan etkinlik açılıyor..."
                : statusLabels[sequenceStatus] || "";
    }


    async function loadStudents() {

        const result = await apiRequest(
            "/api/student-profiles"
        );

        studentSelect.replaceChildren(
            new Option("Öğrenci seçiniz", "")
        );

        for (const student of result.students) {

            studentSelect.add(
                new Option(student.name, student.id)
            );
        }
    }


    function launchAssignedActivity(assignment) {

        if (
            sequenceStatus !== "ACTIVE" ||
            !assignment ||
            !assignment.assignment_id
        ) {

            throw new Error(
                "Geçerli etkinlik ataması bulunamadı."
            );
        }

        window.location.replace(
            "/student/assignment/" +
            encodeURIComponent(
                assignment.assignment_id
            )
        );
    }


    async function initializeDashboard() {

        if (busy) return;

        busy = true;

        initialized = false;

        retryRequired = false;

        message.textContent = "";

        updateInterface();

        try {

            const result = await apiRequest(
                "/api/student-sequence"
            );

            applySequenceResult(result);

            if (sequenceStatus === "ACTIVE") {

                launchAssignedActivity(
                    currentAssignment
                );

                return;
            }

            if (sequenceStatus === "NO_CONTEXT") {

                await loadStudents();
            }

            initialized = true;

        } catch (error) {

            retryRequired = true;

            message.textContent = error.message;

        } finally {

            busy = false;

            updateInterface();
        }
    }


    async function startLearningSession() {

        if (
            busy ||
            !initialized ||
            !studentSelect.value ||
            ![
                "NO_CONTEXT",
                "NO_ELIGIBLE_ASSIGNMENT"
            ].includes(sequenceStatus)
        ) {

            return;
        }

        busy = true;

        message.textContent = "";

        updateInterface();

        try {

            const result = await apiRequest(

                "/api/student-sequence",

                "POST",

                {student_id: studentSelect.value}
            );

            applySequenceResult(result);

            if (sequenceStatus === "ACTIVE") {

                launchAssignedActivity(
                    currentAssignment
                );

                return;
            }

            if (
                sequenceStatus ===
                "NO_ELIGIBLE_ASSIGNMENT"
            ) {

                message.textContent =
                    "Şu anda başlayabileceğiniz " +
                    "etkinlik bulunmuyor.";

            } else {

                throw new Error(
                    "Beklenmeyen öğrenme oturumu durumu."
                );
            }

        } catch (error) {

            retryRequired = true;

            message.textContent = error.message;

        } finally {

            busy = false;

            updateInterface();
        }
    }


    async function resetDashboard(result) {

        applySequenceResult(result);

        initialized = false;

        await loadStudents();

        studentSelect.value = "";

        initialized = true;
    }


    async function continueLearningSession() {

        if (
            busy ||
            retryRequired ||
            sequenceStatus !== "ASSIGNMENT_COMPLETED" ||
            !currentAssignment ||
            !currentPerformanceSessionId
        ) {
            return;
        }

        busy = true;

        message.textContent = "";

        updateInterface();

        try {

            const result = await apiRequest(
                "/api/student-sequence/next",
                "POST",
                {
                    assignment_id:
                        currentAssignment.assignment_id,

                    performance_session_id:
                        currentPerformanceSessionId
                }
            );

            if (result.sequence_status === "ACTIVE") {

                applySequenceResult(result);

                launchAssignedActivity(currentAssignment);

            } else if (
                result.sequence_status === "SEQUENCE_COMPLETED"
            ) {

                await resetDashboard({
                    sequence_status: "NO_CONTEXT",
                    student: null,
                    assignment: null
                });

                message.textContent =
                    "Tebrikler! Bütün etkinliklerini tamamladın!";

            } else {

                throw new Error(
                    "Sonraki etkinlik belirlenemedi."
                );
            }

        } catch (error) {

            retryRequired = true;

            message.textContent = error.message;

        } finally {

            busy = false;

            updateInterface();
        }
    }


    async function endLearningSession() {

        if (
            busy ||
            ![
                "ACTIVE",
                "ASSIGNMENT_COMPLETED",
                "BETWEEN_ASSIGNMENTS"
            ].includes(sequenceStatus)
        ) {

            return;
        }

        busy = true;

        message.textContent = "";

        updateInterface();

        try {

            const result = await apiRequest(
                "/api/student-sequence",
                "DELETE",
                {
                    student_id: currentStudent?.id || null,

                    assignment_id:
                        currentAssignment?.assignment_id || null,

                    performance_session_id:
                        currentPerformanceSessionId
                }
            );

            await resetDashboard(result);

        } catch (error) {

            retryRequired = true;

            message.textContent = error.message;

        } finally {

            busy = false;

            updateInterface();
        }
    }


    async function recoverLearningSession() {

        if (
            busy ||
            sequenceStatus !== "STALE_CONTEXT"
        ) {

            return;
        }

        const confirmed = window.confirm(
            "Eski oturum bilgileri temizlensin mi?"
        );

        if (!confirmed) {

            return;
        }

        busy = true;

        message.textContent = "";

        updateInterface();

        try {

            const result = await apiRequest(
                "/api/student-sequence/recover",
                "POST"
            );

            await resetDashboard(result);

        } catch (error) {

            retryRequired = true;

            message.textContent = error.message;

        } finally {

            busy = false;

            updateInterface();
        }
    }


    studentSelect.addEventListener(
        "change",
        updateInterface
    );

    startButton.addEventListener(
        "click",
        startLearningSession
    );

    endButton.addEventListener(
        "click",
        endLearningSession
    );

    continueButton.addEventListener(
        "click",
        continueLearningSession
    );

    recoverButton.addEventListener(
        "click",
        recoverLearningSession
    );

    retryButton.addEventListener(
        "click",
        initializeDashboard
    );

    initializeDashboard();

</script>

</body>
</html>
